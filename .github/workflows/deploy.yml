name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install --no-package-lock --loglevel verbose
      - name: Build project (with debug)
        run: |
          echo "=== Current directory contents ==="
          ls -la
          echo "=== Running build ==="
          npm run build --debug
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
        if: success()  # 只有构建成功时才上传

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'  # 只有构建成功才部署
    steps:
      - uses: actions/deploy-pages@v4
